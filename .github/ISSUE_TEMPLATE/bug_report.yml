name: Bug report
description: Report a reproducible WisperNext problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: input
    id: microphone
    attributes:
      label: Microphone type and name
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Do not include API keys, audio, or dictated text.
